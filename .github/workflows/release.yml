# Verify every package, then publish them all on a version tag.
#
# Publishing uses OIDC (npm trusted publishing): no long-lived token exists in
# this repository, and each package carries a provenance attestation. Configure
# the trusted publisher for each package on npmjs.com first — see RELEASING.md.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: npm 11.5.1+ (OIDC publishing)
        run: npm install -g npm@latest
      - run: npm install
      - run: npm run check
      - run: npm run install:all
      - run: npm test

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: npm 11.5.1+ (OIDC publishing)
        run: npm install -g npm@latest
      - name: what this tag would release
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("node:fs");
            const tag = process.argv[1];
            const rows = fs.readdirSync("packages").map((d) => {
              const j = JSON.parse(fs.readFileSync(`packages/${d}/package.json`, "utf8"));
              return { name: j.name, version: j.version, matchesTag: j.version === tag };
            });
            for (const r of rows) console.log(`${r.matchesTag ? "=" : " "} ${r.name}@${r.version}`);
            const matching = rows.filter((r) => r.matchesTag).length;
            console.log(`\n${matching}/${rows.length} packages are at v${tag}; the rest are skipped as already published.`);
          ' "$tag"
      - name: stage every package whose version is not on the registry yet
        run: |
          set -euo pipefail
          # Trusted Publisher is configured WITHOUT "Allow npm publish": CI may only
          # stage, and a maintainer approves each version with 2FA on npmjs.com.
          # That keeps a compromised workflow from pushing a release by itself.
          # npm CLI >= 11.15 is required for `npm stage publish`.
          for dir in packages/*/; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version — already published"
              continue
            fi
            echo "::group::stage $name@$version"
            (cd "$dir" && npm stage publish --access public --provenance)
            echo "::endgroup::"
          done
          echo "::notice::staged versions await 2FA approval at https://www.npmjs.com/settings/zfdx123/packages"
