# dsh-mcp-manager bundle patch：单独安装本包时，在组合树中插入管理器行。
#
# 两份 patch 二选一（见 @zfdx123/dsh-atelier 的 patch 头注释）：
#   装入口包 -> 用入口包那份，id 是 `dsh-mcp-manager`
#   单装本包 -> 用下面这份，id 是 `mcp-manager`（就是你在 dump-config 里看到的行 id）
# 两个 id 不同，**都正常**：设置条目的名字（ns）就是行 id，而插件从不按名字找自己的
# 设置条目，而是按值形状认领（见 lib/claim.js）。改 id 不会把「保存」弄坏。
# 被放进 `include` 分组时运行时的 id 还会带上组前缀（`include:dsh-mcp-manager`）。
#
# 挂载 @deepseek-ai/dsh-mcp-client 实例，并在设置页注册「MCP 服务器」配置界面。
# 配置持久化在 settings.yaml，改动即时热生效。
#
# 用户可以在自己的 profile cordis.patch.yml 里按 id 覆盖本行
# （例如禁用：- id: mcp-manager  disabled: true —— 用 dump-config 里那一行的 id）。
# name 是 npm 包名（scoped 版；无 scope 的 dsh-mcp-manager 已被他人占用）。
- insert:
    - id: mcp-manager
      name: '@zfdx123/dsh-mcp-manager'
